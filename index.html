<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CycleHQ · Prototype</title>
    <style>
      :root {
        --brand: #00aa13;
        --text: #1b2333;
        --muted: #6b7280;
        --ease: cubic-bezier(.2, .8, .2, 1);
        --dur: .5s;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 800px at 50% 35%, #ffffff 0%, #eef1f4 55%, #dfe4ea 100%);
        display: flex; flex-direction: column; overflow: hidden;
      }

      /* ── Toolbar ── */
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 24px; position: relative; z-index: 10; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
      .brand-name { font-weight: 700; font-size: 16px; line-height: 1.1; }
      .brand-sub { font-size: 12px; color: var(--muted); }
      .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .segmented { display: inline-flex; padding: 3px; border-radius: 999px; background: #fff; border: 1px solid #e3e7ec; box-shadow: 0 1px 2px rgba(20,30,50,.05); }
      .segmented button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
      .segmented button[aria-pressed="true"] { background: var(--brand); color: #fff; }
      .segmented button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .readout { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; }
      .stage-hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }
      .divider { width: 1px; height: 22px; background: #dde2e8; }

      /* "View as" role toggles — any combination, at least one on */
      .roles { display: flex; align-items: center; gap: 8px; }
      .group-label { font-size: 12px; font-weight: 500; color: var(--muted); }
      .role-toggles { display: inline-flex; gap: 6px; flex-wrap: wrap; }
      .role-toggles button {
        font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
        display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 7px; border-radius: 999px;
        background: #fff; color: var(--muted); border: 1px solid #e3e7ec; box-shadow: 0 1px 2px rgba(20,30,50,.05);
        transition: background .15s, border-color .15s, color .15s;
      }
      .role-toggles .tick { width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid #cbd2da; display: grid; place-items: center; transition: background .15s, border-color .15s; }
      .role-toggles button[aria-pressed="true"] { color: var(--text); background: #e6f9e8; border-color: var(--brand); }
      .role-toggles button[aria-pressed="true"] .tick { background: var(--brand); border-color: var(--brand); }
      .role-toggles button[aria-pressed="false"] .tick svg { visibility: hidden; }
      .role-toggles button[aria-disabled="true"] { cursor: not-allowed; }
      .role-toggles button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .open-link { font-size: 13px; font-weight: 600; color: var(--brand); text-decoration: none; }
      .open-link:hover { text-decoration: underline; }

      /* ── Stage ── */
      .stage { flex: 1; position: relative; min-height: 0; }

      /* ── Device (one element that morphs between MacBook / iPad / iPhone) ── */
      .device {
        --app-top: #f9fafb; --app-bottom: #ffffff; --ink: #111827;
        --menubar: #ececef; --pill: rgba(0,0,0,.06); --hair: rgba(0,0,0,.08);
        position: absolute; left: 50%; top: calc(50% - 14px); /* leaves room for the hint underneath */
        width: calc(var(--sw) + 2 * var(--bz)); height: calc(var(--sh) + 2 * var(--bz));
        padding: var(--bz);
        border-radius: var(--r) var(--r) var(--rb) var(--rb);
        background: var(--frame);
        box-shadow: 0 0 0 var(--ringw) var(--ring), 0 0 0 calc(var(--ringw) + 1px) rgba(0,0,0,.18), 0 50px 90px -30px rgba(20,30,50,.45);
        transform: translate(-50%, -50%) translateY(var(--dy)) scale(var(--s));
        transition: width var(--dur) var(--ease), height var(--dur) var(--ease), padding var(--dur) var(--ease),
          border-radius var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur) var(--ease), transform var(--dur) var(--ease);
      }
      .device.no-anim, .device.no-anim * { transition: none !important; }

      .screen {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        border-radius: var(--sr); background: var(--app-top);
        display: flex; flex-direction: column;
        transition: border-radius var(--dur) var(--ease);
      }
      .screen iframe { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: var(--app-top); }

      /* Screen chrome above / below the site: browser bar on the Mac, status bar + home indicator on iPad / iPhone */
      .chrome-top { position: relative; flex-shrink: 0; height: var(--top); overflow: hidden; background: var(--app-top); transition: height var(--dur) var(--ease); }
      .chrome-bottom { position: relative; flex-shrink: 0; height: var(--bottom); background: var(--app-bottom); transition: height var(--dur) var(--ease); }
      .variant { position: absolute; left: 0; right: 0; top: 0; opacity: 0; transition: opacity .25s; pointer-events: none; color: var(--ink); }
      .device[data-device="desktop"] .only-desktop,
      .device[data-device="tablet"] .only-tablet,
      .device[data-device="phone"] .only-phone { opacity: 1; }

      /* Mac: menu bar + browser toolbar */
      .menubar { height: 25px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12.5px; background: var(--menubar); }
      .menubar .items { display: flex; gap: 18px; }
      .menubar b { font-weight: 600; }
      .browserbar { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--hair); }
      .lights { display: flex; gap: 8px; }
      .lights span { width: 12px; height: 12px; border-radius: 50%; }
      .lights span:nth-child(1) { background: #ff5f57; } .lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }
      .nav-icons { display: flex; gap: 14px; opacity: .55; }
      .url { flex: 1; max-width: 520px; margin: 0 auto; height: 30px; border-radius: 8px; background: var(--pill); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
      .url svg { opacity: .6; }

      /* iPad / iPhone status bars */
      .status { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
      .status .icons { display: flex; align-items: center; gap: 6px; }
      .status-tablet { height: 24px; padding: 0 22px; font-size: 12.5px; }
      .status-phone { height: 54px; padding: 6px 30px 0 40px; font-size: 16px; }

      .home-indicator { position: absolute; left: 50%; bottom: 8px; height: 5px; border-radius: 3px; background: var(--ink-bottom, var(--ink)); transform: translateX(-50%); opacity: 0; transition: opacity .25s; }
      .device[data-device="tablet"] .home-indicator { width: 200px; opacity: .8; bottom: 7px; }
      .device[data-device="phone"] .home-indicator { width: 134px; opacity: .85; }

      /* Hardware details */
      .deco { position: absolute; opacity: 0; transition: opacity .3s; pointer-events: none; }
      .notch { top: var(--bz); left: 50%; width: 180px; height: 26px; margin-left: -90px; background: var(--frame); border-radius: 0 0 10px 10px; z-index: 4; }
      .notch::after { content: ""; position: absolute; top: 9px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #1d2330; }
      .island { top: calc(var(--bz) + 11px); left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; z-index: 4; }
      .ipad-cam { top: calc(var(--bz) / 2 - 4px); left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #2a2d33; }
      .base {
        left: 50%; top: calc(100% - 4px); width: 1760px; height: 26px; margin-left: -880px;
        background: linear-gradient(#e7e9ec, #b9bdc3 70%, #8f949b);
        border-radius: 4px 4px 40px 40px / 4px 4px 20px 20px;
        box-shadow: 0 18px 30px rgba(20,30,50,.22);
      }
      .base::before { content: ""; position: absolute; top: 0; left: 50%; width: 240px; height: 9px; margin-left: -120px; background: linear-gradient(#a9adb3, #c9ccd1); border-radius: 0 0 10px 10px; }
      .btn { background: var(--ring); border-radius: 2px; }
      .device[data-device="desktop"] .notch, .device[data-device="desktop"] .base,
      .device[data-device="tablet"] .ipad-cam, .device[data-device="tablet"] .btn-tablet,
      .device[data-device="phone"] .island, .device[data-device="phone"] .btn-phone { opacity: 1; }

      /* ── Drag handles (sized in screen pixels regardless of device scale) ── */
      .handle {
        position: absolute; top: 0; bottom: 0; width: calc(28px / var(--s)); cursor: ew-resize; touch-action: none; outline: none;
        display: grid; place-items: center; z-index: 6;
      }
      .handle.left { left: calc(-40px / var(--s)); }
      .handle.right { right: calc(-40px / var(--s)); }
      .handle::before {
        content: ""; width: calc(6px / var(--s)); height: calc(64px / var(--s)); border-radius: calc(3px / var(--s));
        background: #aab2bd; transition: background .15s, height .15s;
      }
      .handle:hover::before, .handle:focus-visible::before, body.dragging .handle::before { background: var(--brand); height: calc(96px / var(--s)); }
      body.dragging, body.dragging * { cursor: ew-resize !important; user-select: none; }
      body.dragging iframe { pointer-events: none; }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <div class="brand-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        </div>
        <div>
          <div class="brand-name">CycleHQ</div>
          <div class="brand-sub">Interactive prototype</div>
        </div>
      </div>
      <div class="controls">
        <div class="roles" role="group" aria-label="View as">
          <span class="group-label">View as</span>
          <div class="role-toggles">
            <button type="button" data-role="rider" aria-pressed="true"><span class="tick"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>Rider</button>
            <button type="button" data-role="instructor" aria-pressed="true"><span class="tick"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>Instructor</button>
            <button type="button" data-role="owner" aria-pressed="true"><span class="tick"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>Studio Owner</button>
          </div>
        </div>
        <span class="divider" aria-hidden="true"></span>
        <div class="segmented" role="group" aria-label="Device">
          <button type="button" data-preset="desktop" aria-pressed="true">Desktop</button>
          <button type="button" data-preset="tablet" aria-pressed="false">Tablet</button>
          <button type="button" data-preset="phone" aria-pressed="false">Phone</button>
        </div>
        <span class="readout" id="readout"></span>
        <a class="open-link" href="./app.html" target="_blank" rel="noopener">Open full app ↗</a>
      </div>
    </header>

    <main class="stage" id="stage">
      <p class="stage-hint">Drag a device edge to switch between desktop, tablet and phone</p>
      <div class="device no-anim" id="device" data-device="desktop">
        <div class="deco notch"></div>
        <div class="deco island"></div>
        <div class="deco ipad-cam"></div>
        <div class="deco base"></div>
        <!-- iPhone buttons -->
        <div class="deco btn btn-phone" style="left:-4px; top:150px; width:4px; height:32px"></div>
        <div class="deco btn btn-phone" style="left:-4px; top:210px; width:4px; height:62px"></div>
        <div class="deco btn btn-phone" style="left:-4px; top:285px; width:4px; height:62px"></div>
        <div class="deco btn btn-phone" style="right:-4px; top:235px; width:4px; height:98px"></div>
        <!-- iPad buttons -->
        <div class="deco btn btn-tablet" style="top:-5px; right:90px; width:64px; height:5px"></div>
        <div class="deco btn btn-tablet" style="right:-5px; top:110px; width:5px; height:56px"></div>
        <div class="deco btn btn-tablet" style="right:-5px; top:180px; width:5px; height:56px"></div>

        <div class="screen">
          <div class="chrome-top">
            <div class="variant only-desktop">
              <div class="menubar">
                <div class="items"><b>Safari</b><span>File</span><span>Edit</span><span>View</span><span>History</span><span>Window</span><span>Help</span></div>
                <span class="clock-long"></span>
              </div>
              <div class="browserbar">
                <div class="lights"><span></span><span></span><span></span></div>
                <div class="nav-icons">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </div>
                <div class="url">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                  cyclehq.app
                </div>
                <div class="nav-icons">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                </div>
              </div>
            </div>
            <div class="variant only-tablet">
              <div class="status status-tablet">
                <span class="clock-long"></span>
                <span class="icons" data-status-icons></span>
              </div>
            </div>
            <div class="variant only-phone">
              <div class="status status-phone">
                <span class="clock-short"></span>
                <span class="icons" data-status-icons></span>
              </div>
            </div>
          </div>
          <iframe title="CycleHQ app"></iframe>
          <div class="chrome-bottom"><div class="home-indicator"></div></div>
        </div>

        <div class="handle left" data-side="left" tabindex="0" role="slider" aria-label="Device size (drag or use arrow keys)"></div>
        <div class="handle right" data-side="right" tabindex="0" role="slider" aria-label="Device size (drag or use arrow keys)"></div>
      </div>
    </main>

    <script>
      // Screen sizes use the app's breakpoints: tablet ≥ 768px, desktop ≥ 1024px
      const DEVICES = {
        desktop: { label: "Desktop", sw: 1512, sh: 945,  bz: 16, r: 28, rb: 12, sr: 10, top: 69, bottom: 0,  frame: "#0d0e10", ring: "#3a3c40", ringw: 2, W: 1760, H: 1000, baseDrop: 22 },
        tablet:  { label: "Tablet",  sw: 820,  sh: 1180, bz: 24, r: 46, rb: 46, sr: 22, top: 24, bottom: 20, frame: "#121316", ring: "#c4c8ce", ringw: 4, W: 884,  H: 1240, baseDrop: 0 },
        phone:   { label: "Phone",   sw: 393,  sh: 852,  bz: 12, r: 62, rb: 62, sr: 50, top: 54, bottom: 30, frame: "#0b0b0c", ring: "#8d8f94", ringw: 4, W: 433,  H: 888,  baseDrop: 0 },
      }
      const ORDER = ["phone", "tablet", "desktop"]

      const stage = document.getElementById("stage")
      const device = document.getElementById("device")
      const readout = document.getElementById("readout")
      const frame = device.querySelector("iframe")
      const presetButtons = document.querySelectorAll("[data-preset]")

      // The hash keeps the view shareable, e.g. #phone&roles=rider,owner (all roles when omitted)
      const ROLE_KEYS = ["rider", "instructor", "owner"]
      const hashParams = new URLSearchParams(location.hash.slice(1).replace(/^(desktop|tablet|phone)(?=&|$)/, "device=$1"))
      let current = ORDER.includes(hashParams.get("device")) ? hashParams.get("device") : "desktop"
      let roles = ROLE_KEYS.filter(k => (hashParams.get("roles") || "").split(",").includes(k))
      if (!roles.length) roles = [...ROLE_KEYS]
      const appUrl = () => "./app.html?roles=" + roles.join(",")
      const writeHash = () => history.replaceState(null, "", "#" + current + (roles.length < ROLE_KEYS.length ? "&roles=" + roles.join(",") : ""))
      frame.src = appUrl()

      const STATUS_ICONS = `
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5 5.6 9.1a3.4 3.4 0 0 1 4.8 0z"/><path d="M3.4 6.9a6.5 6.5 0 0 1 9.2 0l-1.1 1.1a5 5 0 0 0-7 0z"/><path d="M1.1 4.6a9.8 9.8 0 0 1 13.8 0l-1.1 1.1a8.2 8.2 0 0 0-11.6 0z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>`
      document.querySelectorAll("[data-status-icons]").forEach(el => { el.innerHTML = STATUS_ICONS })

      function scaleFor(key) {
        const d = DEVICES[key], r = stage.getBoundingClientRect()
        return Math.max(0.15, Math.min((r.width - 140) / d.W, (r.height - 84) / d.H, 1))
      }
      // Distance from the stage centre to a device's drag handle, in screen pixels
      const handleDistance = key => (DEVICES[key].sw / 2 + DEVICES[key].bz) * scaleFor(key) + 26

      function apply(key) {
        current = key
        const d = DEVICES[key], s = scaleFor(key)
        const set = (k, v) => device.style.setProperty(k, v)
        for (const k of ["sw", "sh", "bz", "r", "rb", "sr", "top", "bottom", "ringw"]) set("--" + k, d[k] + "px")
        set("--frame", d.frame); set("--ring", d.ring); set("--s", s); set("--dy", (-d.baseDrop / 2 * s) + "px")
        device.dataset.device = key
        readout.textContent = `${d.sw}px`
        presetButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.preset === key)))
        device.querySelectorAll(".handle").forEach(h => h.setAttribute("aria-valuetext", d.label))
        writeHash()
      }

      // Drag either edge: the device whose edge is nearest the pointer takes over
      device.querySelectorAll(".handle").forEach(handle => {
        const grow = handle.dataset.side === "right" ? "ArrowRight" : "ArrowLeft"
        const shrink = handle.dataset.side === "right" ? "ArrowLeft" : "ArrowRight"
        handle.addEventListener("pointerdown", e => {
          e.preventDefault()
          handle.setPointerCapture(e.pointerId)
          document.body.classList.add("dragging")
          const move = ev => {
            const r = stage.getBoundingClientRect()
            const dist = Math.abs(ev.clientX - (r.left + r.width / 2))
            const nearest = ORDER.reduce((a, b) => Math.abs(dist - handleDistance(a)) <= Math.abs(dist - handleDistance(b)) ? a : b)
            if (nearest !== current) apply(nearest)
          }
          const up = () => {
            document.body.classList.remove("dragging")
            handle.removeEventListener("pointermove", move)
            handle.removeEventListener("pointerup", up)
            handle.removeEventListener("pointercancel", up)
          }
          handle.addEventListener("pointermove", move)
          handle.addEventListener("pointerup", up)
          handle.addEventListener("pointercancel", up)
        })
        handle.addEventListener("keydown", e => {
          const i = ORDER.indexOf(current)
          if (e.key === grow && i < ORDER.length - 1) { apply(ORDER[i + 1]); e.preventDefault() }
          if (e.key === shrink && i > 0) { apply(ORDER[i - 1]); e.preventDefault() }
        })
      })
      presetButtons.forEach(b => b.addEventListener("click", () => apply(b.dataset.preset)))

      // "View as" toggles: any combination of roles, but the last one can't be switched off
      const roleButtons = document.querySelectorAll("[data-role]")
      const openLink = document.querySelector(".open-link")
      function renderRoles() {
        roleButtons.forEach(b => {
          const on = roles.includes(b.dataset.role), last = on && roles.length === 1
          b.setAttribute("aria-pressed", String(on))
          b.setAttribute("aria-disabled", String(last))
          b.title = last ? "At least one role is needed" : ""
        })
        openLink.href = appUrl()
        writeHash()
      }
      const sendRoles = () => { try { frame.contentWindow.postMessage({ type: "cyclehq:roles", roles }, location.origin) } catch { /* app not loaded yet */ } }
      roleButtons.forEach(b => b.addEventListener("click", () => {
        const key = b.dataset.role
        const next = roles.includes(key) ? roles.filter(k => k !== key) : ROLE_KEYS.filter(k => k === key || roles.includes(k))
        if (!next.length) return
        roles = next
        renderRoles()
        sendRoles()
      }))
      // The app says when it's ready, so roles changed while it was still loading aren't lost
      window.addEventListener("message", e => { if (e.source === frame.contentWindow && e.data?.type === "cyclehq:ready") sendRoles() })

      // Tint the status bar / browser bar to match the app (light or dark mode), like Safari does
      // Computed colours can be oklch() etc. (Tailwind v4), so resolve them to RGB through a 1×1 canvas
      const colorCtx = Object.assign(document.createElement("canvas"), { width: 1, height: 1 }).getContext("2d", { willReadFrequently: true })
      function parseRGB(c) {
        if (!c || c === "transparent") return null
        colorCtx.clearRect(0, 0, 1, 1)
        colorCtx.fillStyle = "#000"; colorCtx.fillStyle = c
        colorCtx.fillRect(0, 0, 1, 1)
        const [r, g, b, a] = colorCtx.getImageData(0, 0, 1, 1).data
        return a > 0 ? [r, g, b] : null
      }
      let syncQueued = false
      // Background actually painted at a point in the app: first non-transparent background walking up from the element there
      function bgAt(doc, win, x, y) {
        for (let el = doc.elementFromPoint(x, y); el && el !== doc.documentElement; el = el.parentElement) {
          const c = parseRGB(win.getComputedStyle(el).backgroundColor)
          if (c) return c
        }
        return null
      }
      function syncColors() {
        syncQueued = false
        try {
          const doc = frame.contentDocument, win = frame.contentWindow
          if (!doc || !doc.body) return
          const top = bgAt(doc, win, win.innerWidth / 2, 1) || [249, 250, 251]
          const bottom = bgAt(doc, win, win.innerWidth / 2, win.innerHeight - 1) || top
          const isDark = c => (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255 < 0.45
          const dark = isDark(top)
          const set = (k, v) => device.style.setProperty(k, v)
          set("--app-top", `rgb(${top})`); set("--app-bottom", `rgb(${bottom})`)
          set("--ink", dark ? "#f9fafb" : "#111827")
          set("--ink-bottom", isDark(bottom) ? "#f9fafb" : "#111827")
          set("--menubar", dark ? "#1f1f22" : "#ececef")
          set("--pill", dark ? "rgba(255,255,255,.1)" : "rgba(0,0,0,.06)")
          set("--hair", dark ? "rgba(255,255,255,.08)" : "rgba(0,0,0,.08)")
        } catch { /* cross-origin: keep light chrome */ }
      }
      const queueSync = () => { if (!syncQueued) { syncQueued = true; requestAnimationFrame(syncColors) } }
      frame.addEventListener("load", () => {
        try {
          new MutationObserver(queueSync).observe(frame.contentDocument.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["class"] })
          frame.contentWindow.addEventListener("resize", queueSync)
          frame.contentWindow.addEventListener("scroll", queueSync, true)
          frame.contentDocument.addEventListener("transitionend", queueSync)
        } catch { /* cross-origin */ }
        queueSync()
      })

      function tick() {
        const now = new Date()
        const t = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
        document.querySelectorAll(".clock-short").forEach(el => { el.textContent = t })
        document.querySelectorAll(".clock-long").forEach(el => { el.textContent = `${now.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })}  ${t}` })
      }
      tick(); setInterval(tick, 30000)

      // Refit whenever the stage changes size (window resize, or the toolbar wrapping onto two lines)
      new ResizeObserver(() => apply(current)).observe(stage)
      renderRoles()
      apply(current)
      requestAnimationFrame(() => requestAnimationFrame(() => device.classList.remove("no-anim")))
    </script>
  </body>
</html>
